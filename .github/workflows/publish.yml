name: Publish Valenced plugins

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-valenced-plugins
  cancel-in-progress: false

jobs:
  build-android:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Compile and check timestamp icons offline
        run: bash plugins/platform-indicators/src/build-native.sh "$RUNNER_TEMP/native-output"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-indicators-android
          path: ${{ runner.temp }}/native-output/plugin.jar
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: platform-indicators-android
          path: plugins/platform-indicators

      - name: Build and publish repository
        shell: bash
        run: |
          set -euo pipefail
          packages="$RUNNER_TEMP/valenced-packages"
          git worktree add --detach "$packages" refs/remotes/origin/packages
          python3 scripts/build_catalog.py "$packages"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$packages" add --all
          if ! git -C "$packages" diff --cached --quiet; then
            git -C "$packages" commit -m 'Publish Valenced plugin packages'
          fi
          git add -- index.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Valenced plugin catalog'
          fi

          package_commit=$(git -C "$packages" rev-parse HEAD)
          git push --atomic origin HEAD:refs/heads/main "$package_commit:refs/heads/packages"
